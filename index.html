<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/mark.png" />
    <title>Cohort — Agent Orchestration</title>
    <script>
      // Set the Catppuccin theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('ateam-theme');
          if (t !== 'dark' && t !== 'light') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          }
          var r = document.documentElement;
          r.classList.remove('dark', 'light');
          r.classList.add(t);
          r.style.colorScheme = t;
          if (localStorage.getItem('ateam-palette') === 'comic') r.classList.add('comic');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
